<style>
  * { font-family: 'Tajawal', system-ui, sans-serif; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; }
  @keyframes blob { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.95); } }
  @keyframes blob-slow { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-40px, 30px) scale(1.05); } }
  @keyframes blob-slower { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, -30px) scale(1.1); } }
  .animate-blob { animation: blob 18s ease-in-out infinite; }
  .animate-blob-slow { animation: blob-slow 22s ease-in-out infinite; }
  .animate-blob-slower { animation: blob-slower 26s ease-in-out infinite; }
  @keyframes float-up { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }
  @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  .pulse-soft { animation: pulse-soft 3s ease-in-out infinite; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .hover-wiggle:hover { animation: wiggle 0.4s ease-in-out; }
</style>

const { useState, useEffect, useMemo } = React;
const Icon = ({ name, ...props }) => {
  const ref = React.useRef();
  React.useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      window.lucide.createIcons();
    }
  }, [name]);
  return <span ref={ref} style={{ display: 'inline-flex', ...props.style }} className={props.className} />;
};

      { id: "l2-3", name: "جهاز الدفع الخلفي", machine: "Hip Thrust Machine", sets: 3, reps: "10", notes: "اعصر المؤخرة في الأعلى، ثبّت ثانية", video: "https://www.youtube.com/results?search_query=hip+thrust+machine+form+short" },
      { id: "l2-4", name: "جهاز المؤخرة", machine: "Glute Kickback", sets: 2, reps: "12", notes: "حركة مُتحكمة، ركّز على الانقباض", video: "https://www.youtube.com/results?search_query=glute+kickback+machine+form+short" },
      { id: "l2-5", name: "جهاز السمانة", machine: "Calf Raise Machine", sets: 3, reps: "12–15", notes: "ارفع لين أعلى نقطة وثبّت", video: "https://www.youtube.com/results?search_query=calf+raise+machine+form+short" },
    ],
  },
  rest: {

    accent: "#94a3b8", accentDark: "#64748b", accentLight: "#e2e8f0", accentSoft: "#f8fafc",

    cardio: null, exercises: [],
  },
};

const DEFAULT_SCHEDULE = { 0: "upper1", 1: "lower1", 2: "rest", 3: "upper2", 4: "lower2", 5: "rest", 6: "rest" };
const DAY_NAMES = { 0: "الأحد", 1: "الاثنين", 2: "الثلاثاء", 3: "الأربعاء", 4: "الخميس", 5: "الجمعة", 6: "السبت" };
const ALL_WORKOUT_KEYS = ["upper1", "lower1", "upper2", "lower2", "rest"];

const MOTIVATIONAL_QUOTES = {
  upper1: [
    { text: "القوة لا تأتي من القدرة الجسدية، بل من إرادة لا تنكسر", author: "محمد علي" },
    { text: "كل تمرين تتعب فيه اليوم، يصبح وزناً خفيفاً غداً", author: "" },
    { text: "اضغط على البار كأنه عدوّك، وارفعه كأنه نصرك", author: "" },
    { text: "الألم وقتي، الفخر دائم", author: "" },
  ],
  lower1: [
    { text: "الأقوياء لا يهربون من يوم الأرجل", author: "" },

const TIPS = [
  { icon: "⏱️", title: "الراحة بين الجولات", text: "60–90 ثانية" },
  { icon: "🔥", title: "آخر عدتين", text: "لازم تكون صعبة" },
  { icon: "🎯", title: "الأولوية دائماً", text: "الحركة الصح قبل الوزن" },
  { icon: "🧘", title: "نهاية التمرين", text: "5–10 دقائق إطالة" },
];

const WATER_GOAL = 8;
const SCHEDULE_KEY = "tamreen_custom_schedule_v1";

const todayDate = () => {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
};

function App() {
  const today = useMemo(() => new Date(), []);
  const todayDayNum = today.getDay();

  const [schedule, setSchedule] = useState(DEFAULT_SCHEDULE);
  const [viewedDay, setViewedDay] = useState(todayDayNum);
  const [completed, setCompleted] = useState({});
  const [cardioDone, setCardioDone] = useState({});
  const [water, setWater] = useState(0);
  const [page, setPage] = useState("home");
  const [confettiTrigger, setConfettiTrigger] = useState(0);

  useEffect(() => {
    try {
      const saved = localStorage.getItem(SCHEDULE_KEY);
      if (saved) setSchedule({ ...DEFAULT_SCHEDULE, ...JSON.parse(saved) });
    } catch (_) {}
  }, []);

  useEffect(() => {
    try { localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedule)); } catch (_) {}
  }, [schedule]);

  const viewedKey = schedule[viewedDay] || "rest";
  const workout = WORKOUT_PLAN[viewedKey];
  const isViewingToday = viewedDay === todayDayNum;
  const isViewingRest = viewedKey === "rest";

  const dailyQuote = useMemo(() => {
    const quotes = MOTIVATIONAL_QUOTES[viewedKey] || MOTIVATIONAL_QUOTES.upper1;
    const seed = `${todayDate()}_${viewedKey}`;
    let hash = 0;
    for (let i = 0; i < seed.length; i++) hash = (hash + seed.charCodeAt(i)) % 1000;
    return quotes[hash % quotes.length];
  }, [viewedKey]);

  const STORAGE_DONE = `tamreen_done_${todayDate()}_${viewedDay}`;
  const STORAGE_CARDIO = `tamreen_cardio_${todayDate()}_${viewedDay}`;
  const STORAGE_WATER = `tamreen_water_${todayDate()}`;

  useEffect(() => {
    try {
      const d = localStorage.getItem(STORAGE_DONE);
      const c = localStorage.getItem(STORAGE_CARDIO);
      setCompleted(d ? JSON.parse(d) : {});
      setCardioDone(c ? JSON.parse(c) : {});
    } catch (_) { setCompleted({}); setCardioDone({}); }
  }, [viewedDay]);

  useEffect(() => {
    try {
      const w = localStorage.getItem(STORAGE_WATER);
      if (w) setWater(parseInt(w, 10) || 0);
    } catch (_) {}
  }, []);

  useEffect(() => { try { localStorage.setItem(STORAGE_DONE, JSON.stringify(completed)); } catch (_) {} }, [completed]);
  useEffect(() => { try { localStorage.setItem(STORAGE_CARDIO, JSON.stringify(cardioDone)); } catch (_) {} }, [cardioDone]);
  useEffect(() => { try { localStorage.setItem(STORAGE_WATER, String(water)); } catch (_) {} }, [water]);

  const totalItems = workout.exercises.length + (workout.cardio ? 1 : 0);
  const exDoneCount = workout.exercises.filter((e) => completed[e.id]).length;
  const cDone = !!cardioDone[viewedDay];
  const doneCount = exDoneCount + (cDone && workout.cardio ? 1 : 0);
  const progress = totalItems ? (doneCount / totalItems) * 100 : 0;
  const allDone = totalItems > 0 && doneCount === totalItems;

  const toggleDone = (id) => {
    const wasNotDone = !completed[id];
    setCompleted((prev) => ({ ...prev, [id]: !prev[id] }));
    if (wasNotDone) {
      const newDone = exDoneCount + 1 + (cDone && workout.cardio ? 1 : 0);
      if (newDone === totalItems) setConfettiTrigger((t) => t + 1);
    }
  };

  const toggleCardio = () => {
    const wasNotDone = !cardioDone[viewedDay];
    setCardioDone((prev) => ({ ...prev, [viewedDay]: !prev[viewedDay] }));
    if (wasNotDone && exDoneCount + 1 === totalItems) setConfettiTrigger((t) => t + 1);
  };

  const goToToday = () => setViewedDay(todayDayNum);
  const goToDay = (d) => { setViewedDay(d); setPage("home"); };
  const swapDays = (a, b) => setSchedule((p) => ({ ...p, [a]: p[b], [b]: p[a] }));
  const updateDay = (d, k) => setSchedule((p) => ({ ...p, [d]: k }));
  const resetSchedule = () => setSchedule(DEFAULT_SCHEDULE);

  const waterProgress = (water / WATER_GOAL) * 100;
  const waterDone = water >= WATER_GOAL;
  const addWater = () => setWater((w) => Math.min(WATER_GOAL + 4, w + 1));
  const resetWater = () => setWater(0);
  const resetWorkout = () => { setCompleted({}); setCardioDone((p) => ({ ...p, [viewedDay]: false })); };

  const greeting = useMemo(() => {
    const h = today.getHours();
    if (h < 12) return "صباح الخير";
    if (h < 17) return "مساء الخير";
    return "مساء النور";
  }, [today]);

  return (
    <div className="min-h-screen relative overflow-x-hidden text-slate-800">
      <SkyBackground accent={workout.accent} />
      {confettiTrigger > 0 && <Confetti key={confettiTrigger} accent={workout.accent} />}

      <div className="relative z-10 max-w-3xl mx-auto px-4 sm:px-6 pb-32 pt-5">
        <Header workout={workout} page={page} setPage={setPage} greeting={greeting} />

        {page === "home" && (<>
          <DaySelector schedule={schedule} viewedDay={viewedDay} setViewedDay={setViewedDay} todayDayNum={todayDayNum} isViewingToday={isViewingToday} goToToday={goToToday} />
          <HeroBanner workout={workout} today={today} isViewingToday={isViewingToday} dayLabel={DAY_NAMES[viewedDay]} />
          <QuoteCard quote={dailyQuote} workout={workout} />
          {!isViewingRest && (<>
            <StatsGrid workout={workout} doneCount={doneCount} totalItems={totalItems} />
            <ProgressSection doneCount={doneCount} totalExercises={totalItems} progress={progress} allDone={allDone} onReset={resetWorkout} workout={workout} />
            <ExercisesList exercises={workout.exercises} completed={completed} onToggle={toggleDone} workout={workout} />
            {workout.cardio && <CardioCard cardio={workout.cardio} done={cDone} onToggle={toggleCardio} workout={workout} />}
            <TipsSection />
          </>)}
          <WaterSection water={water} progress={waterProgress} done={waterDone} onAdd={addWater} onReset={resetWater} />
        </>)}

        {page === "week" && <WeekPage schedule={schedule} todayDayNum={todayDayNum} goToDay={goToDay} onEditClick={() => setPage("settings")} />}
        {page === "settings" && <SettingsPage schedule={schedule} updateDay={updateDay} swapDays={swapDays} resetSchedule={resetSchedule} onBack={() => setPage("week")} />}

        <Footer />
      </div>

      <MobileNav page={page} setPage={setPage} accent={workout.accent} />
    </div>
  );
}

function SkyBackground({ accent }) {
  return (<>
    <div className="absolute inset-0 -z-10 pointer-events-none transition-all duration-1000" style={{ background: "linear-gradient(180deg, #fff7ed 0%, #fef3f2 20%, #fefce8 40%, #f0fdf4 70%, #eff6ff 100%)" }} />
    <div className="absolute inset-0 overflow-hidden pointer-events-none">
      <div className="absolute -top-32 -right-20 w-[500px] h-[500px] rounded-full blur-3xl opacity-40 animate-blob" style={{ background: `radial-gradient(circle, ${accent} 0%, transparent 70%)` }} />
      <div className="absolute top-40 -left-32 w-[450px] h-[450px] rounded-full blur-3xl opacity-30 animate-blob-slow" style={{ background: "radial-gradient(circle, #fbbf24 0%, transparent 70%)" }} />
      <div className="absolute bottom-20 right-1/4 w-[400px] h-[400px] rounded-full blur-3xl opacity-25 animate-blob-slower" style={{ background: "radial-gradient(circle, #60a5fa 0%, transparent 70%)" }} />
      <div className="absolute top-1/3 right-1/2 w-[350px] h-[350px] rounded-full blur-3xl opacity-20 animate-blob" style={{ background: "radial-gradient(circle, #f472b6 0%, transparent 70%)" }} />
    </div>
  </>);
}

function Confetti({ accent }) {
  const pieces = useMemo(() => {
    const colors = [accent, "#fbbf24", "#34d399", "#60a5fa", "#f472b6", "#c084fc"];
    return Array.from({ length: 40 }).map((_, i) => ({
      id: i, left: Math.random() * 100, delay: Math.random() * 0.5,

            </div>
            <button onClick={onReset} className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 hover:rotate-180 border border-slate-200 flex items-center justify-center text-slate-500 hover:text-slate-700 transition-all duration-300">
              <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>
        <div className="flex items-stretch gap-1.5 mb-4">
          {cups.map((_, i) => {
            const filled = i < water;
            const isLatest = i === water - 1 && splashId > 0;
            return (
              <div key={i} className={`flex-1 h-12 rounded-lg border-2 transition-all relative overflow-hidden ${filled ? "border-cyan-400" : "bg-slate-50 border-slate-200"} ${isLatest ? "scale-110" : ""}`}
                style={filled ? { background: "linear-gradient(to top, #06b6d4, #67e8f9)", boxShadow: "0 0 12px rgba(6, 182, 212, 0.5)", transition: "all 0.4s ease" } : {}}>
                {filled && (<>
                  <Icon name="droplet" className="absolute inset-0 m-auto w-3.5 h-3.5 text-white" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)" }} />
                  <div className="absolute top-1 left-1 w-1.5 h-1.5 rounded-full bg-white/70" />
                </>)}
              </div>
            );
          })}
        </div>
        <button onClick={handleAdd} className="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl font-black text-sm bg-gradient-to-r from-cyan-400 to-blue-500 text-white transition-all hover:scale-[1.01] active:scale-95" style={{ boxShadow: "0 10px 24px -8px rgba(6, 182, 212, 0.6)" }}>
          <Icon name="droplet" className="w-4 h-4" />شربت كوب ماء
        </button>
        {done && (
          <div className="mt-3 p-3 rounded-xl bg-gradient-to-r from-cyan-50 to-blue-50 border border-cyan-300 text-center">
            <p className="font-black text-cyan-700 text-sm">💧 كملت هدف الماء اليوم</p>
          </div>
        )}
      </div>
    </section>
  );
}

function WeekPage({ schedule, todayDayNum, goToDay, onEditClick }) {
  return (
    <section className="mb-8">
      <div className="text-center mb-6">
        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/80 backdrop-blur border border-white/60 text-slate-500 text-[10px] font-bold mb-3 shadow-sm">
          <Icon name="calendar" className="w-3 h-3" />البرنامج الأسبوعي
        </div>
        <h2 className="text-2xl sm:text-4xl font-black mb-1.5 tracking-tight text-slate-900">جدول الأسبوع</h2>
        <p className="text-slate-500 text-xs">اضغط على أي يوم لاستعراض تمارينه</p>
      </div>
      <button onClick={onEditClick} className="w-full mb-4 inline-flex items-center justify-center gap-2 px-4 py-3 rounded-2xl font-black text-sm bg-slate-900 hover:bg-slate-800 text-white transition shadow-lg hover:shadow-xl hover:scale-[1.01] active:scale-95">
        <Icon name="settings" className="w-4 h-4" />تعديل الجدول
      </button>
      <div className="grid gap-2.5">
        {[0,1,2,3,4,5,6].map((dayNum) => {
          const wKey = schedule[dayNum]; const isToday = dayNum === todayDayNum;
          const isRest = wKey === "rest"; const w = WORKOUT_PLAN[wKey];
          return (
            <button key={dayNum} onClick={() => goToDay(dayNum)} disabled={isRest}
              className="relative group bg-white/85 backdrop-blur-md border rounded-2xl p-3.5 sm:p-4 transition-all text-right overflow-hidden disabled:cursor-default shadow-md hover:shadow-xl hover:-translate-y-0.5 enabled:hover:bg-white"
              style={{ borderColor: isToday ? w.accent : "rgb(226 232 240)", ...(isToday ? { boxShadow: `0 0 0 1px ${w.accent}50, 0 8px 20px -6px ${w.glow}` } : {}) }}>
              {!isRest && <div className="absolute right-0 top-0 bottom-0 w-1" style={{ background: `linear-gradient(to bottom, ${w.accent}, ${w.accentDark})` }} />}
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0 transition-transform group-hover:scale-110 group-hover:rotate-6"
                  style={{ background: `linear-gradient(135deg, ${w.accent}, ${w.accentDark})`, boxShadow: `0 6px 18px -6px ${w.glow}` }}>{w.icon}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap mb-0.5">
                    <h3 className="text-sm sm:text-base font-black text-slate-900">{DAY_NAMES[dayNum]}</h3>
                    {isToday && (<span className="text-[9px] font-black px-2 py-0.5 rounded-full text-white flex items-center gap-1" style={{ background: w.accent }}>
                      <span className="w-1 h-1 rounded-full bg-white animate-pulse" />اليوم</span>)}
                  </div>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <p className={`text-xs font-bold ${isRest ? "text-slate-400" : "text-slate-600"}`}>{w.name}</p>
                    {!isRest && (<><span className="text-slate-300">•</span><span className="text-[10px] text-slate-500 font-mono">{w.code}</span></>)}
                  </div>
                </div>
                {!isRest && <Icon name="chevron-left" className="w-4 h-4 text-slate-400 group-hover:text-slate-700 group-hover:-translate-x-1 transition-all" />}
              </div>
            </button>
          );
        })}
      </div>
    </section>
  );
}

function SettingsPage({ schedule, updateDay, swapDays, resetSchedule, onBack }) {
  const [swapMode, setSwapMode] = useState(false);
  const [swapFirst, setSwapFirst] = useState(null);
  const handleSwapClick = (dayNum) => {
    if (swapFirst === null) setSwapFirst(dayNum);
    else if (swapFirst === dayNum) setSwapFirst(null);
    else { swapDays(swapFirst, dayNum); setSwapFirst(null); }
  };
  return (
    <section className="mb-8">
      <button onClick={onBack} className="mb-4 inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-slate-900 hover:-translate-x-1 transition-all">
        <Icon name="chevron-left" className="w-4 h-4" style={{ transform: "rotate(180deg)" }} />رجوع
      </button>
      <div className="text-center mb-6">
        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/80 backdrop-blur border border-white/60 text-slate-500 text-[10px] font-bold mb-3 shadow-sm">
          <Icon name="settings" className="w-3 h-3" />إعدادات الجدول
        </div>
        <h2 className="text-2xl sm:text-3xl font-black mb-1.5 tracking-tight text-slate-900">تعديل الأسبوع</h2>
        <p className="text-slate-500 text-xs">غيّر نوع تمرين أي يوم أو بدّل بين يومين</p>
      </div>
      <div className="grid grid-cols-2 gap-2.5 mb-5">
        <button onClick={() => { setSwapMode(!swapMode); setSwapFirst(null); }}
          className="inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl font-black text-xs sm:text-sm transition-all shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-95"
          style={swapMode ? { background: "linear-gradient(135deg, #fb923c, #ea580c)", color: "white", boxShadow: "0 6px 18px -6px rgba(251, 146, 60, 0.5)" } : { background: "white", color: "rgb(15 23 42)", border: "1px solid rgb(226 232 240)" }}>
          <Icon name="arrow-left-right" className="w-4 h-4" />{swapMode ? "إلغاء التبديل" : "تبديل بين يومين"}
        </button>
        <button onClick={() => { if (confirm("هل تريد إعادة الجدول للوضع الافتراضي؟")) { resetSchedule(); setSwapMode(false); setSwapFirst(null); } }}
          className="inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl font-black text-xs sm:text-sm bg-white hover:bg-slate-50 border border-slate-200 text-slate-900 transition-all shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-95">
          <Icon name="rotate-ccw" className="w-4 h-4" />الافتراضي
        </button>
      </div>
      {swapMode && (
        <div className="mb-4 p-3 rounded-xl bg-orange-100/80 backdrop-blur border border-orange-300 text-center">
          <p className="text-orange-700 text-xs font-bold">{swapFirst === null ? "اختر اليوم الأول للتبديل" : `تم اختيار ${DAY_NAMES[swapFirst]} — اختر اليوم الثاني`}</p>
        </div>
      )}
      <div className="grid gap-2.5">
        {[0,1,2,3,4,5,6].map((dayNum) => {
          const wKey = schedule[dayNum]; const w = WORKOUT_PLAN[wKey];
          const isFirstSwap = swapFirst === dayNum;
          return <DayEditCard key={dayNum} dayNum={dayNum} workout={w} currentKey={wKey} swapMode={swapMode} isFirstSwap={isFirstSwap} onSwapClick={() => handleSwapClick(dayNum)} onChangeWorkout={(k) => updateDay(dayNum, k)} />;
        })}
      </div>
    </section>
  );
}

function DayEditCard({ dayNum, workout, currentKey, swapMode, isFirstSwap, onSwapClick, onChangeWorkout }) {
  const [showOptions, setShowOptions] = useState(false);
  if (swapMode) return (
    <button onClick={onSwapClick} className="relative bg-white/85 backdrop-blur border rounded-2xl p-3.5 transition-all text-right overflow-hidden shadow-md hover:shadow-lg hover:scale-[1.01] active:scale-95"
      style={{ borderColor: isFirstSwap ? "#fb923c" : "rgb(226 232 240)", background: isFirstSwap ? "#fff7ed" : "rgba(255, 255, 255, 0.85)" }}>
      <div className="absolute right-0 top-0 bottom-0 w-1" style={{ background: isFirstSwap ? "#fb923c" : `linear-gradient(to bottom, ${workout.accent}, ${workout.accentDark})` }} />
      <div className="flex items-center gap-3">
        <div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl flex-shrink-0" style={{ background: `linear-gradient(135deg, ${workout.accent}, ${workout.accentDark})` }}>{workout.icon}</div>
        <div className="flex-1 min-w-0">
          <h3 className="text-sm font-black mb-0.5 text-slate-900">{DAY_NAMES[dayNum]}</h3>
          <p className="text-xs font-bold text-slate-500">{workout.name}</p>
        </div>
        {isFirstSwap ? (
          <div className="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center shadow-md"><Icon name="check" className="w-4 h-4 text-white" /></div>
        ) : (
          <div className="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center"><Icon name="arrow-left-right" className="w-3.5 h-3.5 text-slate-500" /></div>
        )}
      </div>
    </button>
  );
  return (
    <div className="relative bg-white/85 backdrop-blur border border-slate-200 rounded-2xl overflow-hidden shadow-md">
      <div className="absolute right-0 top-0 bottom-0 w-1" style={{ background: `linear-gradient(to bottom, ${workout.accent}, ${workout.accentDark})` }} />
      <button onClick={() => setShowOptions(!showOptions)} className="w-full p-3.5 text-right hover:bg-slate-50 transition">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl flex-shrink-0" style={{ background: `linear-gradient(135deg, ${workout.accent}, ${workout.accentDark})` }}>{workout.icon}</div>
          <div className="flex-1 min-w-0">
            <h3 className="text-sm font-black mb-0.5 text-slate-900">{DAY_NAMES[dayNum]}</h3>
            <p className="text-xs font-bold text-slate-500">{workout.name}</p>
          </div>
          <div className="text-[10px] text-slate-500 font-bold">{showOptions ? "إخفاء" : "تغيير"}</div>
        </div>
      </button>
      {showOptions && (
        <div className="px-3.5 pb-3.5 grid grid-cols-5 gap-1.5 border-t border-slate-200 pt-3 mt-1">
          {ALL_WORKOUT_KEYS.map((key) => {
            const opt = WORKOUT_PLAN[key]; const selected = currentKey === key;
            return (
              <button key={key} onClick={() => { onChangeWorkout(key); setShowOptions(false); }}
                className="flex flex-col items-center gap-1 p-2 rounded-lg transition-all hover:scale-[1.05] active:scale-95"
                style={selected ? { background: `linear-gradient(135deg, ${opt.accent}, ${opt.accentDark})`, color: "white", boxShadow: `0 4px 12px -4px ${opt.glow}` } : { background: "rgb(241 245 249)", color: "rgb(71 85 105)" }}>
                <span className="text-base">{opt.icon}</span>
                <span className="text-[9px] font-black tracking-wider">{opt.code}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Footer() {
  return (
    <footer className="text-center mt-10 pb-4">
      <p className="text-[10px] text-slate-400 tracking-widest uppercase font-bold">تمرين اليوم · Stay Strong 🌅</p>
    </footer>
  );
}

function MobileNav({ page, setPage, accent }) {
  return (
    <nav className="sm:hidden fixed bottom-3 left-3 right-3 z-50">
      <div className="bg-white/90 backdrop-blur-2xl border border-white/60 rounded-2xl p-1.5 flex items-center gap-1.5 shadow-2xl">
        <MobileNavBtn active={page === "home"} onClick={() => setPage("home")} label="الرئيسية" accent={accent} />
        <MobileNavBtn active={page === "week" || page === "settings"} onClick={() => setPage("week")} label="الجدول" accent={accent} />
      </div>
    </nav>
  );
}

function MobileNavBtn({ active, onClick, label, accent }) {
  return (
    <button onClick={onClick} className={`flex-1 flex items-center justify-center py-3 rounded-xl text-sm font-black transition-all ${active ? "text-white scale-[1.02]" : "text-slate-500"}`}
      style={active ? { background: accent, boxShadow: `0 6px 18px -6px ${accent}` } : {}}>{label}</button>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
